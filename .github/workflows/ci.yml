name: cross-platform-ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.88"
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --manifest-path backend/Cargo.toml -- --check
      - name: Check backend
        run: cargo check --manifest-path backend/Cargo.toml --all-targets --locked
      - name: Lint backend
        run: cargo clippy --manifest-path backend/Cargo.toml --all-targets --locked -- -D warnings -A clippy::too_many_arguments
      - name: Test backend
        run: cargo test --manifest-path backend/Cargo.toml --all-targets --locked
      - name: Validate Linux scripts
        if: runner.os == 'Linux'
        run: |
          bash -n scripts/*.sh
          shellcheck scripts/*.sh

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - run: npm run build --prefix frontend
