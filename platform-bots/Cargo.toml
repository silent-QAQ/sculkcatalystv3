[package]
name = "sculk-platform-bots"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Independent Bilibili and Douyin MCP platform adapters for Sculk Agent"
license = "Apache-2.0"

[[bin]]
name = "sculk-bilibili"
path = "src/bin/sculk-bilibili.rs"

[[bin]]
name = "sculk-douyin"
path = "src/bin/sculk-douyin.rs"

[dependencies]
aes-gcm = "0.10"
axum = "0.8"
base64 = "0.22"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-std", "io-util", "macros", "net", "rt-multi-thread", "sync"] }
url = "2"
