services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: sculk_cloud
      POSTGRES_USER: sculk
      POSTGRES_PASSWORD: sculk_dev_password
    ports:
      - "5432:5432"
    volumes:
      - sculk_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sculk -d sculk_cloud"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - sculk_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  sculk_pg_data:
  sculk_redis_data:
