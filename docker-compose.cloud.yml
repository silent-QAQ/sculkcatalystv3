services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: sculk_cloud
      POSTGRES_USER: sculk
      POSTGRES_PASSWORD: ${SCULK_POSTGRES_PASSWORD:?Set SCULK_POSTGRES_PASSWORD in .env before starting Cloud dependencies}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - sculk_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sculk -d sculk_cloud"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7.4-alpine
    environment:
      REDIS_PASSWORD: ${SCULK_REDIS_PASSWORD:?Set SCULK_REDIS_PASSWORD in .env before starting Cloud dependencies}
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$${REDIS_PASSWORD}\""]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - sculk_redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  sculk_pg_data:
  sculk_redis_data:
